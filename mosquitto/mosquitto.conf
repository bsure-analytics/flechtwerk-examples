# Demo MQTT broker for the bridge examples. Anonymous access keeps the
# example wiring minimal; persistence keeps the QoS-1 session backlog across
# an MQTT broker restart, which is what the MqttExtractor's persistent-session
# story (MQTT 5 `clean_start=False` plus a session expiry) relies on.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
